# Настройки голосового сервера LiveKit.
# Ключи задаются переменной LIVEKIT_KEYS из .env (см. docker-compose.yml).

port: 7880
rtc:
  # Весь звук через один UDP-порт — открыть нужно только его.
  udp_port: 7882
  # Запасной путь, если у кого-то заблокирован UDP.
  tcp_port: 7881
  # Узнать внешний IP сервера, чтобы приложения знали, куда слать звук.
  use_external_ip: true
room:
  # Пустой голосовой канал закрывается через 5 минут.
  empty_timeout: 300
logging:
  level: info
