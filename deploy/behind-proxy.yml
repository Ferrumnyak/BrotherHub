# Вариант запуска, когда порты 80/443 уже заняты своим обратным прокси
# (например, Nginx Proxy Manager): шифрование и сертификаты делает он,
# поэтому наш Caddy не запускается, а сервер и голос открываются в локальной
# сети, чтобы прокси мог к ним обращаться.
#
# Включить — строкой в .env:
#   COMPOSE_FILE=docker-compose.yml:behind-proxy.yml
# Подробно — docs/DEPLOY.md, раздел «Если уже есть свой прокси».

services:
  caddy:
    # Профиль, который никто не включает, — Caddy не запускается.
    profiles: ["own-proxy"]

  server:
    ports:
      # Прокси → https://DOMAIN
      - "8080:8080"

  livekit:
    ports:
      # Прокси → https://VOICE_DOMAIN (подключение к голосу).
      # Сам звук (7881/tcp, 7882/udp) идёт мимо прокси, напрямую.
      - "7880:7880"
