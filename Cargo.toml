[workspace]
resolver = "2"
members = ["shared", "server", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ferrumnyak"]

[workspace.dependencies]
brotherwatch-shared = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
