# Собирает Docker-образ сервера и публикует его в GitHub Container Registry.
# На сервере его потом скачивают командой `docker compose pull`.

name: Образ сервера

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/Dockerfile"
      - ".github/workflows/server-image.yml"
  # Кнопка «Run workflow» на вкладке Actions — собрать вручную.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ferrumnyak/brotherwatch-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Тесты сервера
        run: cargo test --locked -p brotherwatch-server -p brotherwatch-shared

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
