[package]
name = "brotherwatch"
description = "BrotherHub — совместный просмотр фильмов и сериалов с друзьями"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Библиотека — для Android (там приложение запускается из Kotlin),
# exe на Windows просто вызывает brotherwatch_lib::run().
[lib]
name = "brotherwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Сборка ByeDPI под Android (build.rs).
cc = "1"

[dependencies]
brotherwatch-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "fs"] }
futures-util.workspace = true
# macos-private-api — прозрачные окна поверх видео на macOS (панель, реакции);
# в tauri.conf.json ему соответствует app.macOSPrivateApi.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
semver = "1"
# Русские субтитры часто в Windows-1251 — переводим в UTF-8.
encoding_rs = "0.8"
# Проверка скачанных mpv и yt-dlp.
sha2 = "0.10"

# Компьютер: шифрование (wss://, https://) системное — SChannel в Windows,
# Security.framework в macOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Обновление по кнопке (update.rs).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# Ссылки-приглашения brotherhub:// (deeplink.rs); второй запуск — в то же окно.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# Загрузка страниц сайтов, которые yt-dlp не знает (см. sites.rs), и
# скачивание плеера при первом запуске (tools.rs).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# Телефон: OpenSSL под Android собирать долго и сложно — берём rustls.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Шифрование на ring: его проще всего собрать под Android (без cmake).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Только macOS: окна AppKit (уровень окон, экраны) — для окна mpv (video.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Только Windows: встраивание видео в окно и привязка mpv к жизни приложения.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
