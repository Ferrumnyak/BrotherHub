[package]
name = "brotherwatch"
description = "BrotherWatch — совместный просмотр фильмов и сериалов с друзьями"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brotherwatch-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
futures-util.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio-tungstenite = "0.26"

# Встраивание видео в окно (только Windows).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
