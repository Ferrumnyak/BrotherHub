[package]
name = "brotherwatch"
description = "BrotherWatch — совместный просмотр фильмов и сериалов с друзьями"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brotherwatch-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
futures-util.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio-tungstenite = "0.26"

# Только Windows: встраивание видео в окно и привязка mpv к жизни приложения.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
