[package]
name = "brotherwatch"
description = "BrotherWatch — совместный просмотр фильмов и сериалов с друзьями"
version.workspace = true
edition.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brotherwatch-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "fs"] }
futures-util.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# native-tls — шифрование (wss://) через встроенный в Windows SChannel.
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
# Загрузка страниц сайтов, которые yt-dlp не знает (см. sites.rs), и
# скачивание плеера при первом запуске (tools.rs). TLS — тот же SChannel,
# что и у tokio-tungstenite: второй TLS-движок в exe не нужен.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# Проверка скачанных mpv и yt-dlp.
sha2 = "0.10"

# Только Windows: встраивание видео в окно и привязка mpv к жизни приложения.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
