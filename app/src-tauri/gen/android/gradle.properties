# Настройки Gradle для сборки Android (BrotherHub).
# Подробно: https://docs.gradle.org/current/userguide/build_environment.html
# Настройки, заданные в Android Studio, имеют приоритет над этим файлом.

# --- Память ---
# Демон Gradle: в нём же работают R8 (сжатие кода релиза) и сборка ресурсов.
# 6 ГБ хватает R8 с youtubedl-android с запасом; ParallelGC быстрее G1 на сборках.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Отдельный демон компилятора Kotlin.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC

# --- Скорость ---
# Параллельная сборка модулей (app, tauri-android, плагины Tauri).
org.gradle.parallel=true
# Кеш результатов задач (~/.gradle/caches/build-cache-1): повторная сборка
# берёт неизменившиеся части готовыми, в том числе после clean.
org.gradle.caching=true
# Кеш конфигурации: второй запуск не пересчитывает build-скрипты.
org.gradle.configuration-cache=true
# Демон остаётся между запусками release.ps1 — не нужно заново прогревать JVM.
org.gradle.daemon=true
# Следить за файлами между сборками, а не перечитывать весь проект.
org.gradle.vfs.watch=true
# Kotlin: инкрементальная компиляция.
kotlin.incremental=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false
